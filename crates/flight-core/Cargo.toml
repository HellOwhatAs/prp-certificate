[package]
name = "flight-core"
version = "0.4.2"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flight-format = { path = "../flight-format" }
ark-bn254 = "0.6"
ark-ec = "0.6"
ark-poly = "0.6"
ark-ff = "0.6"
ark-serialize = "0.6"
ark-groth16 = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-relations = "=0.6.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ark-groth16 = { version = "=0.6.0", default-features = false, features = ["parallel"] }
rayon = "1.12"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "native-certs"] }
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.105"
js-sys = "=0.3.82"
console_error_panic_hook = "0.1"

