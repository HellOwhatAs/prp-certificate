[package]
name = "flight-ui"
version = "0.4.4"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flight-format = { path = "../flight-format" }
qrcode = { version = "=0.14.1", default-features = false }
rqrr = "=0.10.1"
base64 = "0.22"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
fontdue = { version = "=0.9.5", default-features = false, features = ["hashbrown"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
flight-core = { path = "../flight-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "=0.4.55"
web-sys = { version = "=0.3.82", features = ["HtmlCanvasElement", "Window", "Document", "Element"] }
console_error_panic_hook = "0.1"

