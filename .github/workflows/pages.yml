name: Deploy GitHub Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RAYON_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-web-build
      - run: npm ci
      - name: Validate data and every public parameter chunk
        run: python scripts/test-parameter-integrity.py
      - name: Reproduce the public feasible Q1 fixture
        run: node scripts/generate-public-fixture.mjs --check
      - run: npm test
      - name: Install native UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - name: Test workspace, proof recovery and real certificate regressions
        run: cargo test --locked --release --workspace
      - name: Check all three full circuit matrices against the pinned setup
        run: cargo test --locked --release -p flight-core all_circuit_matrices_match_pinned_setup -- --ignored
      - run: node scripts/test-thread-policy.mjs
      - run: node scripts/test-parameters.mjs
      - run: node scripts/test-storage.mjs
      - name: Compile UI, single-thread and multi-thread WASM from source
        run: npm run build:rust
      - name: Pin parameter URLs to this commit
        run: npm run build:pages
      - run: node scripts/test-pages-build.mjs
      - run: node scripts/test-web-preflight.mjs
      - name: Test bundled PDF rendering and current-file downloads
        run: node scripts/test-materials.mjs --built dist/client
      - name: Verify real public certificates and QR import with the built WASM
        run: node scripts/test-web-release.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Test project-path isolation, threading and fallback in Chromium
        run: node scripts/test-web-threads.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist/client
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
